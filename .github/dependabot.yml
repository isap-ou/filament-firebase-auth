version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # The plugin major follows the Filament major (see RELEASING.md).
    # A new Filament major is a manual release decision, not a dependency update.
    ignore:
      - dependency-name: "filament/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
